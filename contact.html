<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fotografía de Naturaleza - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6;">

    <nav style="background-color: #2c3e50; padding: 15px; border-radius: 5px;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; margin-right: 15px;">Inicio</a>
        <a href="about.html" style="color: #ffffff; text-decoration: none; margin-right: 15px;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #ffffff; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="margin-top: 30px;">
        <h1 style="color: #2c3e50;">Ponte en Contacto</h1>
        <form style="display: flex; flex-direction: column; max-width: 300px; gap: 10px;">
            <input type="text" placeholder="Tu nombre" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="email" placeholder="Tu correo electrónico" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <textarea placeholder="Tu mensaje" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; height: 80px;"></textarea>
            <button type="submit" style="padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">Enviar</button>
        </form>
    </main>

</body>
</html>
